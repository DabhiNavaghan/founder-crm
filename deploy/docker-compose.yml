# FoundReach on the server. Lives at /home/opc/apps/foundreach/docker-compose.yml, next to .env and deploy.sh.
# IMAGE_TAG picks the version: "latest" by default, or a short commit SHA to roll back (see README.md).
name: foundreach

services:
  foundreach:
    image: ghcr.io/dabhinavaghan/foundreach:${IMAGE_TAG:-latest}
    container_name: foundreach
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    mem_limit: 768m
    # The app writes nothing to disk and needs no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
